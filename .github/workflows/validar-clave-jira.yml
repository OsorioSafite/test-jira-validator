# Compuerta A · Clave de Jira presente en el Pull Request
#
# Ubicacion: .github/workflows/validar-clave-jira.yml
#
# Dos jobs con responsabilidades separadas a proposito:
#
#   clave  -> BLOQUEANTE. Puro formato, sin secretos, sin red.
#             Es el check que se registra en la regla de proteccion.
#             NO cambiar su `name:` o la regla queda huerfana.
#
#   jira   -> INFORMATIVO. Consulta la API y nunca falla el workflow:
#             si Jira esta caido o el token expiro, sale con exit 0 y
#             deja una advertencia. El merge jamas depende de Atlassian.
#
# Variables y secretos que necesita el job `jira` (a nivel de repositorio):
#   vars.JIRA_BASE_URL        https://TU-SUBDOMINIO.atlassian.net
#   secrets.JIRA_USER_EMAIL   correo de la cuenta dueña del token
#   secrets.JIRA_API_TOKEN    API token de id.atlassian.com
#
# Severidad de la compuerta: variable de repositorio JIRA_KEY_GATE_MODE
#   warn (o sin definir) -> avisa pero deja pasar
#   block                -> falla el check y bloquea el merge

name: Clave de Jira

on:
  pull_request:
    # `edited` es indispensable: la compuerta lee el TITULO del PR.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # BLOQUEANTE · sin secretos, sin red
  # ────────────────────────────────────────────────────────────
  clave:
    name: Clave de Jira presente
    runs-on: ubuntu-latest
    outputs:
      clave: ${{ steps.buscar.outputs.clave }}

    steps:
      - name: Validar clave en rama o titulo
        id: buscar
        env:
          RAMA: ${{ github.head_ref }}
          TITULO: ${{ github.event.pull_request.title }}
          MODO: ${{ vars.JIRA_KEY_GATE_MODE }}
        run: |
          set -euo pipefail

          # Los \b evitan que "RELEASE-2024" haga match como "EASE-2024".
          PATRON='\b[A-Z]{2,6}-[0-9]+\b'
          # Variante estricta, atrapa typos de prefijo tipo EPR-1234:
          # PATRON='\b(ERP|SIS|SOP|GEN|SS|MDA|RH|DEV|MOD|ALMC|DEVOP)-[0-9]+\b'

          CLAVE=$(printf '%s %s' "$RAMA" "$TITULO" \
            | grep -oE "$PATRON" | head -1 || true)

          echo "clave=$CLAVE" >> "$GITHUB_OUTPUT"

          if [ -n "$CLAVE" ]; then
            echo "Clave encontrada: $CLAVE"
            {
              echo "## Ticket \`$CLAVE\`"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Rama | \`$RAMA\` |"
              echo "| Titulo | $TITULO |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Este Pull Request no tiene clave de Jira"
            echo ""
            echo "Ni la rama ni el titulo contienen una clave con formato \`ERP-1234\`."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Rama | \`$RAMA\` |"
            echo "| Titulo | $TITULO |"
            echo ""
            echo "### Como arreglarlo"
            echo ""
            echo "1. **Editar el titulo del PR**: \`[ERP-1234] $TITULO\`"
            echo "2. O **renombrar la rama** para que incluya la clave"
            echo ""
            echo "Al editar el titulo, este check se vuelve a correr solo."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${MODO:-warn}" = "block" ]; then
            echo "::error title=Falta la clave de Jira::Edita el titulo del PR y ponele la clave adelante."
            exit 1
          fi
          echo "::warning title=Falta la clave de Jira::Modo advertencia. En modo bloqueo esto impediria el merge."
          exit 0

  # ────────────────────────────────────────────────────────────
  # INFORMATIVO · consulta Jira y NUNCA falla
  # ────────────────────────────────────────────────────────────
  jira:
    name: Contexto del ticket en Jira
    needs: clave
    if: needs.clave.outputs.clave != ''
    runs-on: ubuntu-latest

    steps:
      - name: Leer el ticket y resolver alcance
        env:
          CLAVE: ${{ needs.clave.outputs.clave }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -uo pipefail

          aviso() {
            echo "::warning title=Contexto de Jira no disponible::$1"
            { echo "## Contexto de Jira no disponible"; echo ""; echo "$1"; } \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ -z "${JIRA_BASE_URL:-}" ] || [ -z "${JIRA_USER_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            aviso "Faltan vars.JIRA_BASE_URL, secrets.JIRA_USER_EMAIL o secrets.JIRA_API_TOKEN en este repositorio."
          fi

          RESP=$(mktemp)
          HTTP=$(curl -sS -o "$RESP" -w '%{http_code}' \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$CLAVE?fields=summary,labels,issuetype" \
            || echo "000")

          case "$HTTP" in
            200) : ;;
            401) aviso "Jira respondio 401. El par correo + token no autentica. Revisar que el correo coincida con la cuenta dueña del token." ;;
            403) aviso "Jira respondio 403. La cuenta autentica pero no tiene permiso Browse Projects sobre el proyecto de $CLAVE." ;;
            404) aviso "El ticket **$CLAVE** no existe en Jira, o la cuenta no puede verlo. Ojo: puede ser un typo en la clave del PR." ;;
            000) aviso "No se pudo contactar a $JIRA_BASE_URL. Revisar el subdominio." ;;
            *)   aviso "Jira respondio HTTP $HTTP de forma inesperada." ;;
          esac

          RESUMEN=$(jq -r '.fields.summary // "(sin resumen)"' "$RESP")
          TIPO=$(jq -r '.fields.issuetype.name // "?"' "$RESP")
          ETIQUETAS=$(jq -r '(.fields.labels // []) | if length == 0 then "(ninguna)" else join(", ") end' "$RESP")

          # Pertenencia EXACTA sobre el arreglo, con precedencia explicita.
          # Esto reemplaza el `case` con comodines de la propuesta original,
          # que era ambiguo con etiquetas multiples.
          ALCANCE=$(jq -r '
            (.fields.labels // []) as $l
            | if   ($l | index("alc-transversal")) then "TRANSVERSAL"
              elif ($l | index("alc-cliente"))     then "CLIENTE ESPECIFICO"
              elif ($l | index("alc-interno"))     then "INTERNO"
              else "SIN ETIQUETA DE ALCANCE" end' "$RESP")

          CLIENTES=$(jq -r '
            [(.fields.labels // [])[] | select(startswith("cli-"))]
            | if length == 0 then "-" else join(", ") end' "$RESP")

          AVAL=$(jq -r '
            (.fields.labels // [])
            | if index("avalado-cliente") then "si" else "no" end' "$RESP")

          # Guarda contra typos: cualquier alc-* fuera del vocabulario conocido.
          DESCONOCIDAS=$(jq -r '
            ["alc-transversal","alc-cliente","alc-interno"] as $ok
            | [(.fields.labels // [])[]
                | select(startswith("alc-"))
                | . as $x
                | select($ok | index($x) == null)]
            | join(", ")' "$RESP")

          {
            echo "## $CLAVE · $RESUMEN"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tipo | $TIPO |"
            echo "| Alcance | **$ALCANCE** |"
            echo "| Clientes | $CLIENTES |"
            echo "| Avalado | $AVAL |"
            echo "| Etiquetas | \`$ETIQUETAS\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ALCANCE" = "SIN ETIQUETA DE ALCANCE" ]; then
            echo "::warning title=Ticket sin etiqueta de alcance::$CLAVE no tiene alc-interno, alc-cliente ni alc-transversal. La notificacion de impacto no podria clasificarlo."
          fi

          if [ -n "$DESCONOCIDAS" ]; then
            echo "::warning title=Etiqueta de alcance desconocida::$CLAVE tiene '$DESCONOCIDAS', que no esta en el vocabulario. Probable error de escritura."
            { echo ""; echo "> Etiqueta \`alc-\` fuera del vocabulario: \`$DESCONOCIDAS\`"; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$ALCANCE" = "CLIENTE ESPECIFICO" ] && [ "$AVAL" = "no" ]; then
            echo "::warning title=Sin aval del cliente::$CLAVE impacta a un cliente y no tiene la etiqueta avalado-cliente. Por ahora informativo, no bloquea."
          fi

          exit 0
